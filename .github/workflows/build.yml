name: Build ZClaim

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Zip ac
        run: unzip -o ZClaim-1.0.0-source.zip -d src_unzipped
      - name: Build
        run: mvn -B package
        working-directory: src_unzipped
      - uses: actions/upload-artifact@v4
        with:
          name: ZClaim
          path: src_unzipped/target/ZClaim.jar
